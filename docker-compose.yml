services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: 0.39.4
    container_name: pocketbase
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_public:/pb/pb_public
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
    command: ["./pocketbase", "serve", "--http=0.0.0.0:8090"]
